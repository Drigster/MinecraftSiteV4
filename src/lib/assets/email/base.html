<!doctype html>
<html lang="ru" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office"
    style="color-scheme: light dark; width: 100%; max-width: 100%; overflow-x: hidden; height: 100%;">

<head>
    <meta charset="utf-8">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <!--[if mso]>
            <noscript>
                <xml>
                    <o:OfficeDocumentSettings
                        xmlns:o="urn:schemas-microsoft-com:office:office"
                    >
                        <o:PixelsPerInch>96</o:PixelsPerInch>
                    </o:OfficeDocumentSettings>
                </xml>
            </noscript>
            <style>
                body,
                table,
                td,
                th,
                div,
                p,
                a,
                h1,
                h2,
                h3,
                h4,
                h5,
                h6 {
                    font-family: "Segoe UI", Arial, sans-serif !important;
                    mso-line-height-rule: exactly;
                }
                .code-text {
                    font-family: "Courier New", Courier, monospace !important;
                }
            </style>
        <![endif]-->
    <title>{{title}}</title>
    <style>
        :root {
            color-scheme: light dark;
            supported-color-schemes: light dark;
        }

        /* Prevent automatic phone/date linking in Apple Mail */
        a[x-apple-data-detectors] {
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
        }

        /* WebKit font smoothing & text size adjust */
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        .btn-link {
            display: inline-block;
            margin-top: 4px;
            margin-bottom: 4px;
            color: #000000 !important;
            text-decoration: none;
            border: 1px solid #fc7155;
            border-radius: 6px;
            padding: 12px 24px;
            background-color: #fc7155;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .btn-link:hover {
            background-color: #e56045 !important;
        }

        /* Dark mode inversion protection for Gmail */
        [data-ogsc] .bg-body {
            background-color: #090f18 !important;
        }

        [data-ogsc] .bg-card {
            background-color: #04060a !important;
        }

        [data-ogsc] .bg-details {
            background-color: #0b121d !important;
        }

        [data-ogsc] .bg-alert {
            background-color: #170f0d !important;
        }

        [data-ogsc] .text-main {
            color: #ddeafd !important;
        }

        [data-ogsc] .text-muted {
            color: #a3a3a3 !important;
        }

        [data-ogsc] .btn-link {
            background-color: #fc7155 !important;
            color: #000000 !important;
        }

        @media only screen and (max-width: 600px) {
            .sm-w-full {
                width: 100% !important;
            }

            .sm-px-6 {
                padding-left: 16px !important;
                padding-right: 16px !important;
            }

            .sm-py-8 {
                padding-top: 24px !important;
                padding-bottom: 24px !important;
            }

            .sm-leading-8 {
                line-height: 28px !important;
            }

            .sm-btn-block {
                display: block !important;
                width: 100% !important;
                box-sizing: border-box !important;
                text-align: center !important;
                padding: 14px 20px !important;
            }

            .sm-code {
                font-size: 26px !important;
                line-height: 32px !important;
                padding: 14px 16px !important;
            }

            .sm-stack-col {
                display: block !important;
                width: 100% !important;
                box-sizing: border-box !important;
                text-align: left !important;
            }

            .sm-stack-val {
                display: block !important;
                width: 100% !important;
                box-sizing: border-box !important;
                text-align: left !important;
                padding-bottom: 8px !important;
            }
        }
    </style>
</head>

<body class="bg-body" style="
            max-width: 100%;
            overflow-x: hidden;
            height: 100%;
            -webkit-font-smoothing: antialiased;
            word-break: break-word;
            overflow-wrap: break-word;
            margin: 0;
            width: 100%;
            padding: 0;
            color: #ddeafd;
            background: #090f18 linear-gradient(#090f18, #090f18);
            background-color: #090f18;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        ">
    <!-- Preheader / preview text -->
    <div style="
                display: none;
                visibility: hidden;
                font-size: 1px;
                color: #ddeafd;
                line-height: 1px;
                max-height: 0px;
                max-width: 0px;
                opacity: 0;
                overflow: hidden;
                mso-hide: all;
            ">
        {{preheader}}
        &#847; &zwnj;&nbsp;&#847; &zwnj;&nbsp;&#847; &zwnj;&nbsp;&#847; &zwnj;&nbsp;&#847; &zwnj;&nbsp;&#847;
        &zwnj;&nbsp;&#847; &zwnj;&nbsp;&#847; &zwnj;&nbsp;&#847; &zwnj;&nbsp;&#847; &zwnj;&nbsp;&#847;
        &zwnj;&nbsp;&#847; &zwnj;&nbsp;&#847; &zwnj;&nbsp;&#847; &zwnj;&nbsp;
    </div>

    <div role="article" aria-roledescription="электронное письмо" aria-label="{{title}}" lang="ru">
        <table width="100%" bgcolor="#090f18" class="bg-body" style="
                    width: 100%;
                    background: #090f18 linear-gradient(#090f18, #090f18);
                    background-color: #090f18;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                " cellpadding="0" cellspacing="0" role="presentation">
            <tr>
                <td align="center" bgcolor="#090f18" style="background-color: #090f18; padding: 24px 8px 48px 8px;">
                    <!-- Outer container: max-width 600px -->
                    <table class="sm-w-full" width="100%" align="center"
                        style="width: 100%; max-width: 600px; margin: 0 auto;" cellpadding="0" cellspacing="0"
                        role="presentation">
                        <tr>
                            <td>
                                <!-- Logo section -->
                                <table cellpadding="0" cellspacing="0" role="presentation" width="100%"
                                    style="width: 100%">
                                    <tr>
                                        <td class="sm-py-8 sm-px-6" style="
                                                    padding: 32px 48px;
                                                    text-align: center;
                                                ">
                                            <a href="{{homeUrl}}">
                                                <img src="{{logoUrl}}" width="96" height="auto" alt="{{sender}}" style="
                                                            border: 0;
                                                            height: auto;
                                                            max-width: 100%;
                                                            display: block;
                                                            margin: 0 auto;
                                                            outline: none;
                                                            text-decoration: none;
                                                            -ms-interpolation-mode: bicubic;
                                                            color: #fc7155;
                                                            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                                                            font-size: 22px;
                                                            font-weight: 700;
                                                        ">
                                            </a>
                                        </td>
                                    </tr>
                                </table>

                                <!-- Content card section -->
                                <table cellpadding="0" cellspacing="0" role="presentation" width="100%"
                                    style="width: 100%">
                                    <tr>
                                        <td align="center" class="sm-px-6">
                                            <table class="sm-w-full" width="100%" align="center" cellpadding="0"
                                                cellspacing="0" role="presentation"
                                                style="width: 100%; max-width: 600px; margin: 0 auto;">
                                                <tr>
                                                    <td class="sm-px-6 bg-card" bgcolor="#04060a" style="
                                                                border-radius: 8px;
                                                                background: #04060a linear-gradient(#04060a, #04060a);
                                                                background-color: #04060a;
                                                                border: 1px solid #141b25;
                                                                padding: 44px 48px;
                                                                text-align: left;
                                                                font-size: 16px;
                                                                line-height: 24px;
                                                                color: #ddeafd;
                                                            ">

                                                        {{content}}

                                                    </td>
                                                </tr>
                                            </table>

                                            <!-- Outer Footer Section -->
                                            <table cellpadding="0" cellspacing="0" role="presentation" width="100%"
                                                style="width: 100%; max-width: 600px; margin: 28px auto 0 auto;">
                                                <tr>
                                                    <td align="center" style="padding: 0 16px; text-align: center;">
                                                        <p
                                                            style="margin: 0 0 6px 0; font-size: 13px; line-height: 18px; color: #768499;">
                                                            © 2026 {{sender}}. Все права защищены.
                                                        </p>
                                                        <p
                                                            style="margin: 0 0 10px 0; font-size: 12px; line-height: 17px; color: #768499;">
                                                            {{footerText}}
                                                        </p>
                                                        <p style="margin: 0; font-size: 12px; line-height: 17px;">
                                                            <a href="https://github.com/Drigster/MinecraftSiteV4/issues"
                                                                style="color: #a3a3a3; text-decoration: underline;">Нашли
                                                                ошибку?</a>
                                                        </p>
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </div>
</body>

</html>
